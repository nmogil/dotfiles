# Noah remote dev DX: minimal Termius/mobile-friendly tmux config

# CMUX/Ghostty + Termius ergonomics
# Keep mouse off by default so the local terminal owns selection/copy-paste.
# Toggle temporarily with Ctrl-b m if you need pane/window mouse interactions.
set -g mouse off
bind m set -g mouse \; display-message "tmux mouse: #{?mouse,on,off}"
set -g history-limit 50000
set -sg escape-time 10

# Copy-mode ergonomics for SSH/tmux clipboard use.
# CMUX is Ghostty-based, so tmux OSC52 clipboard integration may propagate
# copy-mode selections to the local Mac clipboard. `external` is safer than
# `on`: tmux can set the outer clipboard, but apps inside tmux cannot set
# tmux's clipboard arbitrarily.
setw -g mode-keys vi
set -s set-clipboard external
set -as terminal-features ',xterm*:clipboard'
bind [ copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

# Easier window/pane numbering
set -g base-index 1
setw -g pane-base-index 1

# Better color/refresh behavior
set -g default-terminal "tmux-256color"
set -g status-interval 5

# Full tmux command prompt
# Use Ctrl-b : to run any tmux command, e.g. split-window, rename-session, source-file.
bind : command-prompt

# Quick git review popup
bind g display-popup -E -w 90% -h 90% "lazygit"
