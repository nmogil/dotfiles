name: CI
# Syntax checks and every runnable test suite on Linux and macOS. Tests that
# need things CI cannot have (the private companion repo, an installed Pi, a
# live Rex, Linux /proc on macOS) print a SKIP reason instead of failing.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # agents tests need tomllib (3.11+); Hermes config tests need PyYAML.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Syntax-check shell scripts (bash -n)
        run: git ls-files -z dot '*.sh' | xargs -0 -n1 bash -n

      - name: shellcheck (dot update)
        if: runner.os == 'Linux'
        run: shellcheck scripts/update.sh scripts/tests/update.test.sh

      - name: Shell tests
        run: |
          failed=0
          for t in scripts/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Python tests
        run: |
          failed=0
          for t in scripts/tests/*.test.py; do
            echo "::group::$t"
            python3 "$t" -v || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Node tests
        run: |
          failed=0
          for t in scripts/tests/*.test.mjs; do
            echo "::group::$t"
            node "$t" || { echo "::error::$t failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: dot smoke (help, update --help)
        run: |
          ./dot help >/dev/null
          ./dot update --help >/dev/null
