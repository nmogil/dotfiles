name: Rex safe upgrade
on:
  pull_request:
    paths:
      - 'dot'
      - 'scripts/rex-safe-upgrade.py'
      - 'scripts/setup-rex-safe-upgrade.sh'
      - 'scripts/tests/rex-safe-upgrade.test.py'
      - 'templates/pi-rex/**'
      - '.github/workflows/rex-safe-upgrade.yml'
  push:
    branches: [main]
    paths:
      - 'dot'
      - 'scripts/rex-safe-upgrade.py'
      - 'scripts/setup-rex-safe-upgrade.sh'
      - 'scripts/tests/rex-safe-upgrade.test.py'
      - 'templates/pi-rex/**'
      - '.github/workflows/rex-safe-upgrade.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tests/rex-safe-upgrade.test.py -v
      - run: bash -n dot scripts/setup-rex-safe-upgrade.sh scripts/doctor.sh
